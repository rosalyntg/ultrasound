[package]
name = "ultrasound-client"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
bytes = "1.12.0"
futures-core = "0.3.32"
futures-sink = "0.3.32"
futures-util = "0.3.32"
iced = { version = "0.14.0", features = ["image"] }
iced_native = "0.10.3"
tokio = { version = "1.52.3", features = ["macros", "net", "rt", "time"] }
tokio-util = { version = "0.7.18", features = ["net", "codec"] }
tracing-subscriber = "0.3.23"
